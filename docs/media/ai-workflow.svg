<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="title desc"><title id="title">Pro Screen AI: iki yaratıcı yapay zeka akışı</title><desc id="desc">Görsel üretim: istek, marka bağlamı, seçilen motor, galeri ve katmanlı editör. Video düzenleme: istek, proje bağlamı, ajan önerileri, kullanıcı onayı ve zaman çizelgesi.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171421"/><stop offset="1" stop-color="#0e1119"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#777184" stroke-width="1.5"/></marker></defs><rect width="1600" height="990" rx="32" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="66" font-size="18" letter-spacing="5" fill="#b8a6e7">PRO SCREEN AI / YARATICI AKIŞ</text><text x="64" y="135" font-size="48" font-weight="700" fill="#f3effa">Bir istekle başla. Son sözü sen söyle.</text><text x="64" y="211" font-size="24" font-weight="700" fill="#c3abff">01 / GÖRSEL ÜRETİM</text><rect x="64" y="237" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="86" y="272" font-size="15" font-weight="700" fill="#c3abff">01</text><text x="86" y="309" font-size="23" font-weight="700" fill="#f2edf9">İsteğini yaz</text><text x="86" y="342" font-size="18" font-weight="400" fill="#aaa6b7">Yeni üretim veya</text><text x="86" y="367" font-size="18" font-weight="400" fill="#aaa6b7">mevcut görseli düzenle.</text><rect x="84" y="388" width="232" height="25" rx="8" fill="#c3abff" fill-opacity=".10"/><text x="95" y="406" font-size="14" font-weight="400" fill="#c3abff">Serbest üretim de mümkün</text><path d="M343 330h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="364" y="237" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="386" y="272" font-size="15" font-weight="700" fill="#c3abff">02</text><text x="386" y="309" font-size="23" font-weight="700" fill="#f2edf9">Kimliğini taşı</text><text x="386" y="342" font-size="18" font-weight="400" fill="#aaa6b7">Marka, ürün, logo,</text><text x="386" y="367" font-size="18" font-weight="400" fill="#aaa6b7">palet ve referanslar.</text><rect x="384" y="388" width="232" height="25" rx="8" fill="#c3abff" fill-opacity=".10"/><text x="395" y="406" font-size="14" font-weight="400" fill="#c3abff">Kayıtlı kimlik → otomatik bağlam</text><path d="M643 330h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="664" y="237" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="686" y="272" font-size="15" font-weight="700" fill="#c3abff">03</text><text x="686" y="309" font-size="23" font-weight="700" fill="#f2edf9">Motorunu seç</text><text x="686" y="342" font-size="18" font-weight="400" fill="#aaa6b7">Nano Banana / Gemini</text><text x="686" y="367" font-size="18" font-weight="400" fill="#aaa6b7">ve bağlı AI araçları.</text><rect x="684" y="388" width="232" height="25" rx="8" fill="#c3abff" fill-opacity=".10"/><text x="695" y="406" font-size="14" font-weight="400" fill="#c3abff">1K · 2K · 4K hedefi</text><path d="M943 330h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="964" y="237" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="986" y="272" font-size="15" font-weight="700" fill="#c3abff">04</text><text x="986" y="309" font-size="23" font-weight="700" fill="#f2edf9">Sonucu keşfet</text><text x="986" y="342" font-size="18" font-weight="400" fill="#aaa6b7">Galeri, büyük önizleme,</text><text x="986" y="367" font-size="18" font-weight="400" fill="#aaa6b7">referans al ve tekrar üret.</text><rect x="984" y="388" width="232" height="25" rx="8" fill="#c3abff" fill-opacity=".10"/><text x="995" y="406" font-size="14" font-weight="400" fill="#c3abff">Gerçek çıktı ölçüsü görünür</text><path d="M1243 330h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="1264" y="237" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="1286" y="272" font-size="15" font-weight="700" fill="#c3abff">05</text><text x="1286" y="309" font-size="23" font-weight="700" fill="#f2edf9">Son dokunuşu yap</text><text x="1286" y="342" font-size="18" font-weight="400" fill="#aaa6b7">Yazı, logo ve şekiller;</text><text x="1286" y="367" font-size="18" font-weight="400" fill="#aaa6b7">taşınabilir katmanlar.</text><rect x="1284" y="388" width="232" height="25" rx="8" fill="#c3abff" fill-opacity=".10"/><text x="1295" y="406" font-size="14" font-weight="400" fill="#c3abff">Düzenlenebilir .screenimage</text><text x="64" y="466" font-size="18" font-weight="400" fill="#aaa6b7">İstek ve seçili referanslar sağlayıcıya gider. Motorların görsel üretim ve boyut yetenekleri değişebilir.</text><text x="64" y="573" font-size="24" font-weight="700" fill="#8cd8ca">02 / VIDEO DÜZENLEME</text><rect x="64" y="599" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="86" y="634" font-size="15" font-weight="700" fill="#8cd8ca">01</text><text x="86" y="671" font-size="23" font-weight="700" fill="#f2edf9">Amacını anlat</text><text x="86" y="704" font-size="18" font-weight="400" fill="#aaa6b7">Hazır görev seç veya</text><text x="86" y="729" font-size="18" font-weight="400" fill="#aaa6b7">serbest bir istek yaz.</text><rect x="84" y="750" width="232" height="25" rx="8" fill="#8cd8ca" fill-opacity=".10"/><text x="95" y="768" font-size="14" font-weight="400" fill="#8cd8ca">Akıllı zoom · kısa versiyon</text><path d="M343 692h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="364" y="599" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="386" y="634" font-size="15" font-weight="700" fill="#8cd8ca">02</text><text x="386" y="671" font-size="23" font-weight="700" fill="#f2edf9">Bağlamı hazırla</text><text x="386" y="704" font-size="18" font-weight="400" fill="#aaa6b7">Proje özeti, tıklamalar,</text><text x="386" y="729" font-size="18" font-weight="400" fill="#aaa6b7">konuşma ve sessizlikler.</text><rect x="384" y="750" width="232" height="25" rx="8" fill="#8cd8ca" fill-opacity=".10"/><text x="395" y="768" font-size="14" font-weight="400" fill="#8cd8ca">İsteğe bağlı tekil kareler</text><path d="M643 692h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="664" y="599" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="686" y="634" font-size="15" font-weight="700" fill="#8cd8ca">03</text><text x="686" y="671" font-size="23" font-weight="700" fill="#f2edf9">Önerileri üret</text><text x="686" y="704" font-size="18" font-weight="400" fill="#aaa6b7">Codex, Claude Code,</text><text x="686" y="729" font-size="18" font-weight="400" fill="#aaa6b7">Cursor veya OpenCode.</text><rect x="684" y="750" width="232" height="25" rx="8" fill="#8cd8ca" fill-opacity=".10"/><text x="695" y="768" font-size="14" font-weight="400" fill="#8cd8ca">Zoom · yazı · kesme · hız</text><path d="M943 692h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="964" y="599" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="986" y="634" font-size="15" font-weight="700" fill="#8cd8ca">04</text><text x="986" y="671" font-size="23" font-weight="700" fill="#f2edf9">İncele ve seç</text><text x="986" y="704" font-size="18" font-weight="400" fill="#aaa6b7">Zamanları ve gerekçeleri</text><text x="986" y="729" font-size="18" font-weight="400" fill="#aaa6b7">gör; uygula veya reddet.</text><rect x="984" y="750" width="232" height="25" rx="8" fill="#8cd8ca" fill-opacity=".10"/><text x="995" y="768" font-size="14" font-weight="400" fill="#8cd8ca">Kontrol sende kalır</text><path d="M1243 692h13" stroke="#777184" stroke-width="2" marker-end="url(#arrow)"/><rect x="1264" y="599" width="272" height="190" rx="20" fill="#1e1d29" stroke="#383342"/><text x="1286" y="634" font-size="15" font-weight="700" fill="#8cd8ca">05</text><text x="1286" y="671" font-size="23" font-weight="700" fill="#f2edf9">Kurguna işle</text><text x="1286" y="704" font-size="18" font-weight="400" fill="#aaa6b7">Seçilen önerileri gerçek</text><text x="1286" y="729" font-size="18" font-weight="400" fill="#aaa6b7">zaman çizelgesine uygula.</text><rect x="1284" y="750" width="232" height="25" rx="8" fill="#8cd8ca" fill-opacity=".10"/><text x="1295" y="768" font-size="14" font-weight="400" fill="#8cd8ca">Düzenle · geri al · dışa aktar</text><text x="64" y="828" font-size="18" font-weight="400" fill="#aaa6b7">Ajan önerileri onay verilmeden projeyi değiştirmez. Bağlı aracın hesabı ve kullanım limitleri geçerlidir.</text><path d="M64 886H1536" stroke="#34303e"/><text x="64" y="932" font-size="16" font-weight="700" fill="#c3abff">YEREL KÜTÜPHANE</text><text x="64" y="960" font-size="18" font-weight="400" fill="#aaa6b7">Markalar ve çalışmalar bilgisayarında.</text><text x="600" y="932" font-size="16" font-weight="700" fill="#c3abff">GÖRÜNÜR KULLANIM</text><text x="600" y="960" font-size="18" font-weight="400" fill="#aaa6b7">Sağlayıcının bildirdiği token ve önbellek.</text><text x="1120" y="932" font-size="16" font-weight="700" fill="#c3abff">İKİ AYRI STÜDYO</text><text x="1120" y="960" font-size="18" font-weight="400" fill="#aaa6b7">Tek ana ekran, bağımsız çalışma alanları.</text></g></svg>